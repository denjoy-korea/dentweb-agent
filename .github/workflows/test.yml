name: Windows Test

# 태그(릴리스)를 달기 전에 PR에서 같은 의존성·시험·빌드를 돌린다. 게시하지 않는다.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentweb-agent-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hash-locked dependencies
        run: |
          # PowerShell 여러 줄 단계는 마지막 명령의 종료 코드만 본다. 명령마다 확인한다.
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-bootstrap.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows credential, config, updater, export and GUI regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build desktop client (not published)
        run: |
          pyinstaller --onefile --noconsole --name dentweb-agent `
            --collect-all customtkinter `
            --hidden-import cv2 `
            --add-data "images;images" `
            --uac-admin `
            main.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/dentweb-agent.exe)) { throw "build output missing" }
