name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A version is built and published once, from its tag's exact source.
concurrency:
  group: dentweb-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip check
      - name: Windows credential, config, updater and GUI regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate tag and source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import ast, os, re; tag = os.environ['RELEASE_TAG']; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag); tree = ast.parse(open('gui.py', encoding='utf-8').read()); version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'VERSION' for t in n.targets)); assert tag == 'v' + version, (tag, version)"
      - name: Build existing desktop client
        run: |
          pyinstaller --onefile --noconsole --name dentweb-agent `
            --collect-all customtkinter `
            --hidden-import cv2 `
            --add-data "images;images" `
            --uac-admin `
            main.py
      - name: Record checksum and source
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $hash = (Get-FileHash dist/dentweb-agent.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  dentweb-agent.exe" | Set-Content -Encoding ascii dist/SHA256SUMS
          $env:RELEASE_COMMIT | Set-Content -Encoding ascii dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dentweb-agent
          path: |
            dist/dentweb-agent.exe
            dist/SHA256SUMS
            dist/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dentweb-agent
          path: release
      - name: Verify exact artifact
        working-directory: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(tr -d '\r\n' < SOURCE_COMMIT)" = "$RELEASE_COMMIT"
      - name: Publish verified files together
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/dentweb-agent.exe
            release/SHA256SUMS
            release/SOURCE_COMMIT
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            Windows DPAPI로 에이전트 토큰을 보호합니다. 기존 평문 설정은 첫 실행 시 자동으로 전환합니다.
            클릭 좌표, 이미지 인식, exports 경로와 시작프로그램 기능을 유지합니다.
            업데이트 체크섬 검증과 배포 파일의 원본 커밋 확인을 추가했습니다.
            다른 PC 또는 Windows 사용자 계정으로 옮기면 앱에서 토큰을 다시 복사해 연결하세요.
