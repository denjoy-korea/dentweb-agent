name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A version is built and published once, from its tag's exact source.
concurrency:
  group: dentweb-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-bootstrap.txt
          python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements.txt -r requirements-build.txt
          python -m pip check
      - name: Windows credential, config, updater, export and GUI regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate tag and source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import ast, os, re; tag = os.environ['RELEASE_TAG']; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag); tree = ast.parse(open('gui.py', encoding='utf-8').read()); version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'VERSION' for t in n.targets)); assert tag == 'v' + version, (tag, version)"
      - name: Build existing desktop client
        run: |
          pyinstaller --onefile --noconsole --name dentweb-agent `
            --collect-all customtkinter `
            --hidden-import cv2 `
            --add-data "images;images" `
            --uac-admin `
            main.py
      - name: Record checksum and source
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $hash = (Get-FileHash dist/dentweb-agent.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  dentweb-agent.exe" | Set-Content -Encoding ascii dist/SHA256SUMS
          $env:RELEASE_COMMIT | Set-Content -Encoding ascii dist/SOURCE_COMMIT
          Copy-Item RELEASE_NOTES.md dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dentweb-agent
          path: |
            dist/dentweb-agent.exe
            dist/SHA256SUMS
            dist/SOURCE_COMMIT
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dentweb-agent
          path: release
      - name: Verify exact artifact
        working-directory: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(tr -d '\r\n' < SOURCE_COMMIT)" = "$RELEASE_COMMIT"
      # 사전 릴리스로 게시한다. 웹 다운로드 링크와 자동 업데이트(releases/latest)는 사전 릴리스를 받지 않는다.
      # 실제 덴트웹 PC에서 확인한 뒤 `gh release edit <태그> --prerelease=false --latest`로 승격한다.
      - name: Publish verified files together as a pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: DentWeb Agent ${{ github.ref_name }}
          prerelease: true
          files: |
            release/dentweb-agent.exe
            release/SHA256SUMS
            release/SOURCE_COMMIT
          fail_on_unmatched_files: true
          overwrite_files: false
          body_path: release/RELEASE_NOTES.md
